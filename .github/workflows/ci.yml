name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # Provide dummy values — tests mock all real connections
      DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-32-chars-minimum!
      GROQ_API_KEY: ci-test-key
      OPENAI_API_KEY: ci-test-key
      ANTHROPIC_API_KEY: ci-test-key
      AI_PROVIDER_PRIORITY: groq,openai,claude

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 18)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
